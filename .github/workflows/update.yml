name: Update backlog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci || npm install
      - name: Fetch trophies from PSN
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: |
          set -o pipefail
          if [ -z "$PSN_NPSSO" ]; then
            echo "Ошибка: секрет PSN_NPSSO не задан" | tee fetch.log
            exit 1
          fi
          node scripts/fetch_psn.js 2>&1 | tee fetch.log
      - name: Build markdown
        run: python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "backlog-bot"
          git config user.email "backlog-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Нет изменений" && exit 0
          git commit -m "Обновление бэклога $(date -u +%F)"
          git push
      - name: Install mail renderer
        if: failure()
        run: python3 -m pip install --quiet markdown==3.7
      - name: Notify on failure
        if: failure()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/sync_failure_mail.py
