name: Update backlog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci || npm install
      - name: Fetch trophies from PSN
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: |
          if [ -z "$PSN_NPSSO" ]; then echo "Секрет PSN_NPSSO не задан — пропуск."; exit 0; fi
          node scripts/fetch_psn.js
      - name: Build markdown
        run: python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "backlog-bot"
          git config user.email "backlog-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Нет изменений" && exit 0
          git commit -m "Обновление бэклога $(date -u +%F)"
          git push
