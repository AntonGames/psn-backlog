name: Update backlog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci || npm install
      - name: Fetch trophies from PSN
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: |
          if [ -z "$PSN_NPSSO" ]; then
            echo "::error::Секрет PSN_NPSSO не задан — синк трофеев невозможен."
            exit 1
          fi
          node scripts/fetch_psn.js
      - name: Build markdown
        run: python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "backlog-bot"
          git config user.email "backlog-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Нет изменений" && exit 0
          git commit -m "Обновление бэклога $(date -u +%F)"
          git push
      - name: Notify on failure
        if: failure()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 scripts/send_mail.py "⚠ PSN бэклог: синк трофеев не прошёл" - <<'TXT'
          Ежедневная выгрузка трофеев из PSN не удалась.

          Чаще всего причина — истёк или не задан токен NPSSO (живёт ~60 дней).
          Что сделать:
          1. Войти на playstation.com и открыть https://ca.account.sony.com/api/v1/ssocookie
          2. Скопировать значение npsso (лучше со второго аккаунта).
          3. GitHub → Settings → Secrets and variables → Actions → PSN_NPSSO → Update.
          4. Actions → Update backlog → Run workflow.

          Лог запуска: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TXT
